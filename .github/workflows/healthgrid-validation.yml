                  )

              audit_ddl = control_sql
              if "UQ_audit_log_run_table_stage UNIQUE (adf_run_id, table_id, stage)" not in audit_ddl:
                  errors.append("Fresh control-table DDL must enforce the run/table/stage audit natural key.")
              if "UQ_audit_log_run_table_stage" not in audit_migration or "HAVING COUNT(*) > 1" not in audit_migration:
                  errors.append("Existing-database audit migration must precheck duplicate natural keys before creating its unique index.")

              expected_audit_pipelines = [
                  (main_pipeline, "SOURCE_TO_SILVER"),
                  (gold_pipeline, "SILVER_TO_GOLD"),
              ]
              for document, stage in expected_audit_pipelines:
                  start = find_activity(document, "Insert In Progress Status")
                  failed = find_activity(document, "Update Fialed Status")
                  if not start:
                      errors.append(f"{stage} pipeline is missing its audit start activity.")
                      continue
                  start_sql = "\\n".join(
                      script.get("text", {}).get("value", "")
                      for script in start.get("typeProperties", {}).get("scripts", [])
                  )
                  if "MERGE ctrl.audit_log WITH (HOLDLOCK)" not in start_sql or f"'{stage}' AS stage" not in start_sql:
                      errors.append(f"{stage} audit start must use a HOLDLOCK upsert with its stage key.")
                  if not failed:
                      errors.append(f"{stage} pipeline is missing its failure audit update.")
                  else:
                      failure_sql = "\\n".join(
                          script.get("text", {}).get("value", "")
                          for script in failed.get("typeProperties", {}).get("scripts", [])
                      )
                      if f"stage = '{stage}'" not in failure_sql:
                          errors.append(f"{stage} failure audit update is not stage-scoped.")
                      if "IF @@ROWCOUNT <> 1" not in failure_sql:
                          errors.append(f"{stage} failure audit update must fail if exactly one row was not updated.")

              # Gold model mapping, output-count meaning, and failure termination.
              expected_gold_models = {
                  "patient_360": "05_Databricks_Repository/Gold/NB_patient_360.py",
                  "hospital_daily_summary": "05_Databricks_Repository/Gold/NB_hospital_daily_summary.py",
                  "lab_test_trends": "05_Databricks_Repository/Gold/NB_lab_test_trends.py",
              }
              gold_runner = find_activity(gold_pipeline, "Silver to Gold")
              gold_runner_path = gold_runner.get("typeProperties", {}).get("notebookPath", {}).get("value", "")
              if "NB_@{item().gold_table_name}" not in gold_runner_path:
                  errors.append("Gold notebook path must be resolved from the selected metadata gold_table_name.")
              gold_lookup = find_activity(gold_pipeline, "Read Source Tables List")
              gold_lookup_sql = gold_lookup.get("typeProperties", {}).get("source", {}).get("sqlReaderQuery", {}).get("value", "")
              for required in ("table_id", "gold_table_name", "is_active=1", "SILVER_TO_GOLD"):
                  if required not in gold_lookup_sql:
                      errors.append(f"Gold metadata lookup is missing required active-model field/filter: {required}.")
              for model_name, model_path in expected_gold_models.items():
                  if not Path(model_path).is_file():
                      errors.append(f"Configured Gold notebook is missing: {model_path}")
                      continue
                  model_source = Path(model_path).read_text(encoding="utf-8")
                  if f"CREATE OR REPLACE TABLE healthgrid.gold.{model_name}" not in model_source:
                      errors.append(f"{model_name} must materialize its configured Gold output table.")
                  if "record_count = updated_df.count()" not in model_source:
                      errors.append(f"{model_name} must count its materialized Gold output rows.")
                  if 'dbutils.notebook.exit(str(record_count))' not in model_source:
                      errors.append(f"{model_name} must return the validated Gold output row count to ADF.")
                  model_lines = [line.strip() for line in model_source.splitlines()]
                  if any(line in {"updated_df", "up"} for line in model_lines):
                      errors.append(f"{model_name} contains an orphan expression before its output validation cell.")
                  if "required_columns" not in model_source or "duplicate_" not in model_source:
                      errors.append(f"{model_name} must retain its schema and grain validation.")
                  required_input_checks = {
                      "patient_360": [
                          "lab_result_id", "assert_unique_non_null_key",
                          "orphan_patient_events", "orphan_hospital_refs", "orphan_provider_refs",
                          "allowed_statuses", "invalid_lab_events",
                      ],
                      "hospital_daily_summary": [
                          "lab_result_id", "assert_unique_non_null_key",
                          "orphan_hospital_events", "orphan_doctor_events",
                          "missing_calendar_dates", "allowed_statuses", "invalid_lab_events",
                      ],
                      "lab_test_trends": [
                          "lab_result_id", "assert_unique_non_null_key",
                          "missing_calendar_months", "allowed_statuses", "invalid_lab_events",
                      ],
                  }
                  for required in required_input_checks[model_name]:
                      if required not in model_source:
                          errors.append(f"{model_name} is missing Gold input quality check: {required}.")
              # README, artifact inventory, and runbook must describe the same Gold publication guard.
              gold_docs = {
                  "README.md": [
                      "Before each `CREATE OR REPLACE TABLE`",
                      "Gold now fails closed on duplicate event IDs",
                      "rather than automatically deduplicating Silver",
                  ],
                  "docs/ARTIFACT_AUDIT.md": [
                      "pre-publication input-integrity checks",
                      "unique laboratory event IDs",
                      "not Silver deduplication",
                  ],
                  "docs/OPERATIONS_RUNBOOK.md": [
                      "Fresh source initialization",
                      "does not drop existing data",
                      "duplicate `lab_result_id`",
                  ],
              }
              for doc_path, required_phrases in gold_docs.items():
                  doc_text = Path(doc_path).read_text(encoding="utf-8") if Path(doc_path).is_file() else ""
                  for phrase in required_phrases:
                      if phrase not in doc_text:
                          errors.append(f"{doc_path} is missing current implementation/operational statement: {phrase}")

              gold_fail_update = find_activity(gold_pipeline, "Update Fialed Status")
              gold_fail_terminator = find_activity(gold_pipeline, "Update pipeline as failed")
              if not gold_fail_update or not gold_fail_terminator:
                  errors.append("Gold failure path must update audit state and terminate the pipeline.")
              else:
                  fail_deps = gold_fail_terminator.get("dependsOn", [])
                  if not any(
                      dep.get("activity") == "Update Fialed Status"
                      and dep.get("dependencyConditions") == ["Succeeded"]
                      for dep in fail_deps
                  ):
                      errors.append("Gold pipeline Fail activity must run only after the failure-audit update succeeds.")
              gold_success_update = find_activity(gold_pipeline, "Update Success Status")
              gold_success_sql = "\\n".join(
                  script.get("text", {}).get("value", "")
                  for script in (gold_success_update or {}).get("typeProperties", {}).get("scripts", [])
              )
              if "records_written = @{activity('Silver to Gold').output.runOutput}" not in gold_success_sql:
                  errors.append("Gold success audit must store the notebook's validated output row count.")

              source_success = find_activity(inner_pipeline, "Update Success Status")
              gold_success = find_activity(gold_pipeline, "Update Success Status")
              for activity, stage in [
                  (source_success, "SOURCE_TO_SILVER"),
                  (gold_success, "SILVER_TO_GOLD"),
              ]:
                  if not activity:
                      errors.append(f"Missing {stage} success audit activity.")
                      continue
                  success_sql = "\\n".join(
                      script.get("text", {}).get("value", "")
                      for script in activity.get("typeProperties", {}).get("scripts", [])
                  )
                  if f"stage = '{stage}'" not in success_sql:
                      errors.append(f"{stage} success audit update is not stage-scoped.")
                  if "IF @@ROWCOUNT <> 1" not in success_sql:
                      errors.append(f"{stage} success audit update must fail if exactly one row was not updated.")

              # Master orchestration must wait for both source branches, gate Gold, and attempt notification.
              master_path = Path("04_Azure Data Factory Repository/pipeline/PL_MASTER.json")
              email_path = Path("04_Azure Data Factory Repository/pipeline/PL_SEND_EMAIL.json")
              master_document = json.loads(master_path.read_text(encoding="utf-8"))
              email_document = json.loads(email_path.read_text(encoding="utf-8"))
              master_activities = {a["name"]: a for a in master_document["properties"]["activities"]}
              postgres_activity = master_activities.get("Source to Silver Postgres", {})
              adls_activity = master_activities.get("Source to Silver ADLS csv", {})
              gold_gate = master_activities.get("Run Gold only when both sources succeed", {})
              notification = master_activities.get("Send Email", {})
              if not postgres_activity or not adls_activity or not gold_gate or not notification:
                  errors.append("PL_MASTER is missing a required source, Gold gate, or notification activity.")
              else:
                  gate_dependencies = {
                      (d.get("activity"), tuple(d.get("dependencyConditions", [])))
                      for d in gold_gate.get("dependsOn", [])
                  }
                  for source_name in ("Source to Silver Postgres", "Source to Silver ADLS csv"):
                      if (source_name, ("Completed",)) not in gate_dependencies:
                          errors.append(f"Gold gate must wait for {source_name} to complete, regardless of outcome.")
                  gate_expression = gold_gate.get("typeProperties", {}).get("expression", {}).get("value", "")
                  for source_name in ("Source to Silver Postgres", "Source to Silver ADLS csv"):
                      expected = f"equals(activity('{source_name}').Status,'Succeeded')"
                      if expected not in gate_expression:
                          errors.append(f"Gold gate expression must explicitly require {source_name} to succeed.")
                  true_activities = gold_gate.get("typeProperties", {}).get("ifTrueActivities", [])
                  if not any(
                      a.get("type") == "ExecutePipeline"
                      and a.get("typeProperties", {}).get("pipeline", {}).get("referenceName") == "PL_SILVER_TO_GOLD"
                      and a.get("typeProperties", {}).get("waitOnCompletion") is True
                      for a in true_activities
                  ):
                      errors.append("Gold gate true branch must wait for PL_SILVER_TO_GOLD.")
                  if gold_gate.get("typeProperties", {}).get("ifFalseActivities") != []:
                      errors.append("Gold gate false branch must not invoke downstream processing.")
                  if not any(
                      d.get("activity") == "Run Gold only when both sources succeed"
                      and "Completed" in d.get("dependencyConditions", [])
                      for d in notification.get("dependsOn", [])
                  ):
                      errors.append("Notification must follow the Gold decision's Completed path.")
                  email_parameters = notification.get("typeProperties", {}).get("parameters", {})
                  for parameter in ("adf_run_id", "postgres_status", "adls_status", "gold_status"):
                      if parameter not in email_parameters:
                          errors.append(f"PL_MASTER must pass {parameter} to PL_SEND_EMAIL.")
              notification_parameters = email_document.get("properties", {}).get("parameters", {})
              for parameter in ("postgres_status", "adls_status", "gold_status"):
                  if parameter not in notification_parameters:
                      errors.append(f"PL_SEND_EMAIL is missing parent branch parameter {parameter}.")
              email_subject_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Prepare Email Subject"),
                  {}
              )
              email_subject_expression = email_subject_activity.get("typeProperties", {}).get("value", {}).get("value", "")
              for parameter in ("postgres_status", "adls_status", "gold_status"):
                  if f"pipeline().parameters.{parameter}" not in email_subject_expression:
                      errors.append(f"Email subject must incorporate {parameter}.")
              if "'FAILED'" not in email_subject_expression or "'SUCCESS'" not in email_subject_expression:
                  errors.append("Email subject must distinguish FAILED from SUCCESS.")
              email_body_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Prepare Logic apps body"),
                  {}
              )
              email_body_expression = email_body_activity.get("typeProperties", {}).get("value", {}).get("value", "")
              for parameter in ("postgres_status", "adls_status", "gold_status"):
                  if f"pipeline().parameters.{parameter}" not in email_body_expression:
                      errors.append(f"Email payload must expose {parameter}.")

              email_header_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Prepare Email body Header"),
                  {}
              )
              email_header_expression = email_header_activity.get("typeProperties", {}).get("value", {})
              header_value = email_header_expression.get("value", "") if isinstance(email_header_expression, dict) else ""
              for parameter in ("postgres_status", "adls_status", "gold_status"):
                  if f"pipeline().parameters.{parameter}" not in header_value:
                      errors.append(f"Human-readable email header must display {parameter}.")

              notification_contract_path = Path("docs/NOTIFICATION_CONTRACT.md")
              if not notification_contract_path.is_file():
                  errors.append("Notification producer contract documentation is missing.")
              else:
                  notification_contract = notification_contract_path.read_text(encoding="utf-8")
                  if "Logic Apps workflow/definition is not included" not in notification_contract:
                      errors.append("Notification contract must disclose that the external Logic Apps consumer is not checked in.")
              if '"adf_run_id":"@{pipeline().parameters.adf_run_id}"' not in email_body_expression:
                  errors.append("Notification payload must include the parent ADF run ID at the root.")
              for required_field in ('"email_receipients":', '"pipeline_statuses":', '"status_table":'):
                  if required_field not in email_body_expression:
                      errors.append(f"Notification payload is missing producer contract field {required_field}.")
              email_read_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Read All tables status"),
                  {}
              )
              email_read_query = email_read_activity.get("typeProperties", {}).get("source", {}).get("sqlReaderQuery", {}).get("value", "")
              if "SELECT *" in email_read_query.upper():
                  errors.append("Notification audit lookup must explicitly project stable audit columns.")
              for required in ("audit_id", "adf_run_id", "table_id", "stage", "status", "records_written", "start_time", "end_time", "created_timestamp", "ORDER BY table_id, stage"):
                  if required not in email_read_query:
                      errors.append(f"Notification audit lookup is missing stable projection/order field: {required}")
              if "WHERE adf_run_id = '@{pipeline().parameters.adf_run_id}'" not in email_read_query:
                  errors.append("Notification audit lookup must be scoped to the parent ADF run ID.")
              failed_count_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Check overall failed count"),
                  {}
              )
              failed_count_query = failed_count_activity.get("typeProperties", {}).get("source", {}).get("sqlReaderQuery", {}).get("value", "")
              if "status != 'SUCCESS'" not in failed_count_query or "pipeline().parameters.adf_run_id" not in failed_count_query:
                  errors.append("Notification failed-count query must count every non-SUCCESS audit state for the parent run.")
              web_activity = next(
                  (a for a in email_document["properties"]["activities"] if a.get("name") == "Send Email"),
                  {}
              )
              if web_activity.get("typeProperties", {}).get("httpRequestTimeout") != "00:02:00":
                  errors.append("Notification Web Activity must use the documented two-minute HTTP response timeout.")
              if web_activity.get("policy", {}).get("retry") != 0:
                  errors.append("Notification Web Activity retries must remain disabled until receiver-side run-ID deduplication is implemented.")

              # Reject empty metadata results instead of succeeding with an empty ForEach.
              for document, label in ((main_pipeline, "source"), (gold_pipeline, "Gold")):
                  top = {a.get("name"): a for a in document["properties"]["activities"]}
                  guard_name = "Validate Active Source Tables" if label == "source" else "Validate Active Gold Models"
                  guard = top.get(guard_name, {})
                  loop = top.get("Ingest All tables", {})
                  guard_expression = guard.get("typeProperties", {}).get("expression", {}).get("value", "")
                  if "length(activity('Read Source Tables List').output.value)" not in guard_expression:
                      errors.append(f"{label} dispatcher must explicitly reject an empty active metadata result.")
                  false_activities = guard.get("typeProperties", {}).get("ifFalseActivities", [])
                  if not any(a.get("type") == "Fail" for a in false_activities):
                      errors.append(f"{label} metadata guard false branch must contain a Fail activity.")
                  if not any(
                      d.get("activity") == guard_name and "Succeeded" in d.get("dependencyConditions", [])
                      for d in loop.get("dependsOn", [])
                  ):
                      errors.append(f"{label} ForEach must depend on successful metadata validation.")
          except Exception as exc:
              errors.append(f"Repository contract validation failed: {exc}")

          readme = Path("README.md").read_text(encoding="utf-8") if Path("README.md").exists() else ""
          if "![HealthGrid Data Platform Architecture](assets/architecture-overview.png)" not in readme:
              errors.append("README must retain the original architecture image embed.")

          # Detect common committed credential patterns without printing matched values.
          secret_patterns = [
              re.compile(r"https://[^\s\"']+logic\.azure\.com/[^\s\"']*[?&]sig=[A-Za-z0-9%_\-]{20,}", re.I),
              re.compile(r"(?:AccountKey|SharedAccessSignature)=[^;\s\"']{12,}", re.I),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          scan_files = [
              p for p in Path(".").rglob("*")
              if p.is_file() and included(p)
              and p.suffix.lower() in {".json", ".py", ".sql", ".yml", ".yaml", ".md", ".txt", ".conf"}
          ]
          for path in scan_files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in secret_patterns:
                  if pattern.search(text):
                      errors.append(f"Potential committed credential pattern detected in {path}; value suppressed.")

          print(f"Validated {len(json_files)} JSON files, {len(notebook_files)} notebooks, and {len(python_files)} Python files.")
          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors))
              sys.exit(1)
          print("Repository artifact validation passed.")
          PY
