name: HealthGrid Repository Validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.json"
      - "**/*.ipynb"
      - "**/*.py"
      - "**/*.sql"
      - "**/*.md"
      - "**/*.csv"
      - "**/*.xlsx"
      - "assets/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.json"
      - "**/*.ipynb"
      - "**/*.py"
      - "**/*.sql"
      - "**/*.md"
      - "**/*.csv"
      - "**/*.xlsx"
      - "assets/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON, notebooks, Python, docs, and secret hygiene
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import csv
          import json
          import re
          import sys
          from datetime import date, datetime
          from pathlib import Path

          errors = []
          json_files = list(Path(".").rglob("*.json"))
          notebook_files = list(Path(".").rglob("*.ipynb"))
          python_files = list(Path(".").rglob("*.py"))

          excluded = {".git", ".venv", "venv", "__pycache__"}
          def included(path):
              return not any(part in excluded for part in path.parts)

          json_files = [p for p in json_files if included(p)]
          notebook_files = [p for p in notebook_files if included(p)]
          python_files = [p for p in python_files if included(p)]

          for path in json_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"Invalid JSON: {path}: {exc}")

          for path in notebook_files:
              try:
                  notebook = json.loads(path.read_text(encoding="utf-8"))
                  metadata = notebook.get("metadata", {})
                  databricks_metadata = metadata.get("application/vnd.databricks.v1+notebook", {})
                  notebook_language = (
                      metadata.get("language_info", {}).get("name")
                      or databricks_metadata.get("language")
                      or "python"
                  ).lower()

                  for index, cell in enumerate(notebook.get("cells", [])):
                      if cell.get("cell_type") != "code":
                          continue
                      source = cell.get("source", [])
                      source = "".join(source) if isinstance(source, list) else source
                      if not source.strip():
                          errors.append(f"Empty code cell: {path}:cell-{index}")
                          continue
                      if notebook_language == "sql":
                          # SQL notebooks are validated as notebook JSON here;
                          # their SQL must be executed/validated in Databricks.
                          continue
                      if notebook_language == "python":
                          compile(source, f"{path}:cell-{index}", "exec")
                      else:
                          errors.append(f"Unsupported notebook language '{notebook_language}': {path}")
              except Exception as exc:
                  errors.append(f"Invalid notebook or code cell: {path}: {exc}")

          for path in python_files:
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except Exception as exc:
                  errors.append(f"Invalid Python syntax: {path}: {exc}")

          required_docs = [
              "README.md",
              "docs/ENGINEERING_DECISIONS.md",
              "docs/DATA_DICTIONARY.md",
              "docs/OPERATIONS_RUNBOOK.md",
              "docs/VALIDATION_PLAN.md",
              "docs/DEPLOYMENT.md",
              "docs/ARTIFACT_AUDIT.md",
              "docs/FILE_INGESTION_MANIFEST.md",
              "docs/SOURCE_FIXTURE_CONTRACT.md",
              "docs/ADF_SOURCE_EXTRACTION_CONTRACT.md",
              "docs/NOTIFICATION_CONTRACT.md",
          ]
          for name in required_docs:
              if not Path(name).is_file():
                  errors.append(f"Required documentation missing: {name}")

          adf_contract_path = Path("docs/ADF_SOURCE_EXTRACTION_CONTRACT.md")
          if not adf_contract_path.is_file():
              errors.append("ADF source extraction contract document is required.")
          else:
              adf_contract = adf_contract_path.read_text(encoding="utf-8")
              for contract_phrase in (
                  "metadata-to-source path",
                  "double-quoted identifiers",
                  "missing watermark row",
                  "half-open interval",
                  "exactly one row",
                  "copy-level no-file/error",
                  "not cdc",
                  "adf-18 through adf-24",
              ):
                  if contract_phrase not in adf_contract.lower():
                      errors.append(f"ADF source extraction contract is missing required boundary: {contract_phrase}")

          # Release rollback and persisted-state recovery documentation contract.
          deployment_doc = Path("docs/DEPLOYMENT.md").read_text(encoding="utf-8")
          validation_doc = Path("docs/VALIDATION_PLAN.md").read_text(encoding="utf-8")
          required_rollback_controls = [
              "## 8. Release rollback and data recovery",
              "Reverting Git alone does not change the live published factory.",
              "There are no automatic down migrations.",
              "watermarks, audit rows, and manifest states",
              "do not treat a table version number alone as a guaranteed recovery point.",
              "Never restore only the control database or only the lake",
              "Re-enable schedules only after the recovery owner records the evidence",
          ]
          for required in required_rollback_controls:
              if required not in deployment_doc:
                  errors.append(f"Deployment rollback guide is missing required control: {required}")

          for recovery_test in ("RCV-01", "RCV-02", "RCV-03", "RCV-04", "RCV-05", "RCV-06", "RCV-07"):
              if recovery_test not in validation_doc:
                  errors.append(f"Validation plan is missing release-recovery scenario {recovery_test}.")
          if "G6A — Release rollback" not in validation_doc:
              errors.append("Validation plan must include the G6A release rollback acceptance gate.")
          if "BLOCKED rather than PASS" not in validation_doc:
              errors.append("Release-recovery tests must distinguish blocked runtime evidence from a pass.")

          # SQL initialization/reset and migration safety contracts.
          source_init_path = Path("01_Sources Data/01_postgres/create_source_tables.sql")
          source_reset_path = Path("01_Sources Data/01_postgres/reset_source_tables.sql")
          control_init_path = Path("02_Metadata Table Queries/create_control_tables.sql")
          control_reset_path = Path("02_Metadata Table Queries/drop_control_tables.sql")
          watermark_migration_path = Path("02_Metadata Table Queries/add_watermark_lookback.sql")
          audit_migration_path = Path("02_Metadata Table Queries/migrate_audit_log_unique_key.sql")

          sql_assets = {
              "source initializer": source_init_path,
              "source reset": source_reset_path,
              "control initializer": control_init_path,
              "control reset": control_reset_path,
              "watermark migration": watermark_migration_path,
              "audit migration": audit_migration_path,
          }
          for label, path in sql_assets.items():
              if not path.is_file():
                  errors.append(f"Required SQL asset missing: {path}")

          if all(path.is_file() for path in sql_assets.values()):
              source_init = source_init_path.read_text(encoding="utf-8")
              source_reset = source_reset_path.read_text(encoding="utf-8")
              control_init = control_init_path.read_text(encoding="utf-8")
              control_reset = control_reset_path.read_text(encoding="utf-8")
              watermark_migration = watermark_migration_path.read_text(encoding="utf-8")
              audit_migration = audit_migration_path.read_text(encoding="utf-8")

              if re.search(r"\\bDROP\\s+TABLE\\b", source_init, re.I):
                  errors.append("Fresh PostgreSQL source initialization must not drop existing tables.")
              for required in (
                  "to_regclass('public.hospitals')",
                  "to_regclass('public.doctors')",
                  "to_regclass('public.patients')",
                  "RAISE EXCEPTION",
                  "SET search_path TO public",
              ):
                  if required not in source_init:
                      errors.append(f"PostgreSQL source initializer is missing its fail-closed contract: {required}")

              for required in (
                  "current_setting('healthgrid.allow_destructive_reset', true) IS DISTINCT FROM 'true'",
                  "RESET healthgrid.allow_destructive_reset",
                  "BEGIN;",
                  "COMMIT;",
                  "DROP TABLE IF EXISTS public.patients",
                  "DROP TABLE IF EXISTS public.doctors",
                  "DROP TABLE IF EXISTS public.hospitals",
              ):
                  if required not in source_reset:
                      errors.append(f"PostgreSQL reset is missing explicit safety control: {required}")
              if source_reset.count("DROP TABLE") != 3:
                  errors.append("PostgreSQL reset must drop only the three named HealthGrid source tables.")

              required_control_tables = (
                  "ctrl.table_config", "ctrl.watermark", "ctrl.audit_log",
                  "ctrl.file_ingestion_manifest",
              )
              for table in required_control_tables:
                  if f"OBJECT_ID('{table}', 'U')" not in control_init:
                      errors.append(f"Control-table initializer preflight is missing {table}.")
              if "DROP TABLE" in control_init.upper():
                  errors.append("Fresh Azure SQL control initialization must never drop existing control tables.")
              if "SESSION_CONTEXT(N'healthgrid_control_init_allowed')" not in control_init:
                  errors.append("Control initializer must gate all GO-separated batches on its session preflight.")
              go_batches = len(re.findall(r"^GO$", control_init, re.M))
              init_gate_checks = control_init.count("SESSION_CONTEXT(N'healthgrid_control_init_allowed')")
              if go_batches < 2 or init_gate_checks < go_batches - 1:
                  errors.append("Control initializer must check its session gate before every batch after the preflight.")
              if "EXEC sys.sp_set_session_context @key = N'healthgrid_control_init_allowed', @value = NULL" not in control_init:
                  errors.append("Control initializer must clear its internal session gate after seed completion.")

              for required in (
                  "SESSION_CONTEXT(N'healthgrid_allow_destructive_reset')",
                  "BEGIN TRANSACTION",
                  "COMMIT TRANSACTION",
                  "ROLLBACK TRANSACTION",
                  "sp_set_session_context @key = N'healthgrid_allow_destructive_reset', @value = NULL",
              ):
                  if required not in control_reset:
                      errors.append(f"Azure SQL control reset is missing transaction/authorization control: {required}")
              if control_reset.count("DROP TABLE ctrl.") != 4:
                  errors.append("Azure SQL reset must drop exactly the four HealthGrid control tables.")
              if not (
                  control_reset.index("DROP TABLE ctrl.file_ingestion_manifest")
                  < control_reset.index("DROP TABLE ctrl.audit_log")
                  < control_reset.index("DROP TABLE ctrl.watermark")
                  < control_reset.index("DROP TABLE ctrl.table_config")
              ):
                  errors.append("Azure SQL reset must drop control tables in FK-safe child-first order.")

              if re.search(r"\\b(DROP\\s+TABLE|TRUNCATE\\s+TABLE|DELETE\\s+FROM\\s+ctrl\\.watermark)\\b", watermark_migration, re.I):
                  errors.append("Watermark lookback migration must not delete/reset control data or checkpoints.")
              if "UPDATE ctrl.watermark" in watermark_migration.upper():
                  errors.append("Watermark lookback migration must leave existing checkpoint values unchanged.")
              for required in ("COL_LENGTH('ctrl.table_config', 'watermark_lookback_minutes')", "watermark_lookback_minutes = 5"):
                  if required not in watermark_migration:
                      errors.append(f"Watermark migration is missing its guarded configuration update: {required}")

              for required in (
                  "HAVING COUNT(*) > 1",
                  "51011",
                  "51012",
                  "i.is_unique = 1",
                  "key_ordinal = 1 AND c.name = 'adf_run_id'",
                  "key_ordinal = 2 AND c.name = 'table_id'",
                  "key_ordinal = 3 AND c.name = 'stage'",
                  "CREATE UNIQUE INDEX UQ_audit_log_run_table_stage",
              ):
                  if required not in audit_migration:
                      errors.append(f"Audit-key migration is missing a duplicate/index-definition safeguard: {required}")
              if re.search(r"\\b(DELETE\\s+FROM|TRUNCATE\\s+TABLE)\\s+ctrl\\.audit_log", audit_migration, re.I):
                  errors.append("Audit-key migration must never delete or truncate audit history.")


          # Source fixture content, cardinality, replay guards, and configured strategy.
          def read_csv_fixture(path):
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      reader = csv.DictReader(handle)
                      if not reader.fieldnames:
                          errors.append(f"CSV fixture has no header: {path}")
                          return []
                      return list(reader)
              except Exception as exc:
                  errors.append(f"Unable to parse CSV fixture {path}: {exc}")
                  return []

          initial_lab_path = Path("01_Sources Data/02_adls_csv/Initial_laod/lab_results_2026_09_14_1329.csv")
          incremental_lab_path = Path("01_Sources Data/02_adls_csv/Incremental_load/lab_results_2026_09_14_1440.csv")
          initial_provider_path = Path("01_Sources Data/02_adls_csv/Initial_laod/insurance_providers.csv")
          incremental_provider_path = Path("01_Sources Data/02_adls_csv/Incremental_load/insurance_providers.csv")
          round1_sql_path = Path("01_Sources Data/01_postgres/run_incremental_load.sql")
          round2_sql_path = Path("01_Sources Data/01_postgres/run_incremental_load_round_2.sql")
          fixture_contract_path = Path("docs/SOURCE_FIXTURE_CONTRACT.md")

          fixture_paths = (
              initial_lab_path, incremental_lab_path,
              initial_provider_path, incremental_provider_path,
              round1_sql_path, round2_sql_path, fixture_contract_path,
          )
          for path in fixture_paths:
              if not path.is_file():
                  errors.append(f"Required source fixture asset missing: {path}")

          if all(path.is_file() for path in fixture_paths):
              initial_lab = read_csv_fixture(initial_lab_path)
              incremental_lab = read_csv_fixture(incremental_lab_path)
              initial_providers = read_csv_fixture(initial_provider_path)
              incremental_providers = read_csv_fixture(incremental_provider_path)
              round1_sql = round1_sql_path.read_text(encoding="utf-8")
              round2_sql = round2_sql_path.read_text(encoding="utf-8")
              fixture_contract = fixture_contract_path.read_text(encoding="utf-8")
              required_lab_columns = {
                  "lab_result_id", "patient_id", "hospital_id", "doctor_id",
                  "test_name", "test_date", "result_value", "result_unit",
                  "result_status", "reported_at",
              }
              required_provider_columns = {
                  "insurance_provider_id", "provider_name", "provider_type",
                  "contact_email", "coverage_region",
              }

              for path, rows, expected_columns in (
                  (initial_lab_path, initial_lab, required_lab_columns),
                  (incremental_lab_path, incremental_lab, required_lab_columns),
                  (initial_provider_path, initial_providers, required_provider_columns),
                  (incremental_provider_path, incremental_providers, required_provider_columns),
              ):
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      header = set(next(csv.reader(handle), []))
                  if header != expected_columns:
                      errors.append(f"CSV fixture header does not match the expected source schema: {path}")

              def numeric_ids(rows, field, label):
                  try:
                      values = [int(row[field]) for row in rows]
                  except (KeyError, TypeError, ValueError):
                      errors.append(f"{label} contains a missing or non-integer {field}.")
                      return []
                  if len(values) != len(set(values)):
                      errors.append(f"{label} contains duplicate {field} values.")
                  return values

              initial_lab_ids = numeric_ids(initial_lab, "lab_result_id", "Initial lab fixture")
              incremental_lab_ids = numeric_ids(incremental_lab, "lab_result_id", "Incremental lab fixture")
              if len(initial_lab) != 8228 or initial_lab_ids != list(range(1, 8229)):
                  errors.append("Initial lab fixture must contain 8,228 rows with contiguous lab_result_id values 1-8,228.")
              if len(incremental_lab) != 20 or incremental_lab_ids != list(range(8229, 8249)):
                  errors.append("Incremental lab fixture must contain 20 new rows with contiguous lab_result_id values 8,229-8,248.")
              combined_lab_ids = initial_lab_ids + incremental_lab_ids
              if len(combined_lab_ids) != 8248 or len(set(combined_lab_ids)) != 8248:
                  errors.append("Initial and incremental lab fixtures must combine to 8,248 unique event IDs.")

              for label, rows in (("Initial lab fixture", initial_lab), ("Incremental lab fixture", incremental_lab)):
                  for row in rows:
                      try:
                          if not 1 <= int(row["patient_id"]) <= 5000:
                              raise ValueError("patient_id outside 1-5000")
                          if not 1 <= int(row["hospital_id"]) <= 50:
                              raise ValueError("hospital_id outside 1-50")
                          if not 1 <= int(row["doctor_id"]) <= 500:
                              raise ValueError("doctor_id outside 1-500")
                          if row["result_status"] not in {"Normal", "Abnormal", "Critical"}:
                              raise ValueError("unsupported result_status")
                          date.fromisoformat(row["test_date"])
                          datetime.fromisoformat(row["reported_at"])
                      except (KeyError, TypeError, ValueError) as exc:
                          errors.append(f"{label} has an invalid reference, status, or ISO date/time: {exc}")
                          break

              initial_provider_ids = numeric_ids(initial_providers, "insurance_provider_id", "Initial provider fixture")
              incremental_provider_ids = numeric_ids(incremental_providers, "insurance_provider_id", "Incremental provider fixture")
              if len(initial_providers) != 25 or initial_provider_ids != list(range(1, 26)):
                  errors.append("Initial insurance-provider fixture must be a complete 25-row snapshot with IDs 1-25.")
              if len(incremental_providers) != 30 or incremental_provider_ids != list(range(1, 31)):
                  errors.append("Incremental insurance-provider fixture must be a complete 30-row snapshot with IDs 1-30.")
              for label, rows in (("Initial provider fixture", initial_providers), ("Incremental provider fixture", incremental_providers)):
                  for row in rows:
                      if "Demo" not in row["provider_name"] or not row["contact_email"].endswith(".example"):
                          errors.append(f"{label} must use fictional Demo names and reserved .example contact addresses.")
                          break

              if not {3, 8, 14, 21}.issubset(set(incremental_provider_ids)):
                  errors.append("Later provider snapshot must include IDs referenced by the round-2 patient fixture.")

              control_seed = Path("02_Metadata Table Queries/create_control_tables.sql").read_text(encoding="utf-8")
              if not re.search(r"\('adls_csv', NULL, 'lab_results'.*?'APPEND'", control_seed, re.S):
                  errors.append("lab_results must remain configured as APPEND for additive event-file delivery.")
              if not re.search(r"\('adls_csv', NULL, 'insurance_providers'.*?'FULL'", control_seed, re.S):
                  errors.append("insurance_providers must remain configured as FULL for complete replacement snapshots.")

              for label, sql, round_marker in (
                  ("round 1", round1_sql, "Riverside Specialty Hospital"),
                  ("round 2", round2_sql, "Lakeside Community Hospital"),
              ):
                  advisory_key = "healthgrid:incremental-fixture:" + ("round-1" if label == "round 1" else "round-2")
                  if not all(token in sql for token in ("BEGIN;", "SET LOCAL search_path TO public;", "pg_advisory_xact_lock", advisory_key, "DO $healthgrid_", "RAISE EXCEPTION", round_marker, "COMMIT;")):
                      errors.append(f"PostgreSQL incremental fixture {label} is missing its transaction, advisory lock, or replay guard.")
                  guard_end = sql.find("$healthgrid_" + ("round1_guard$;" if label == "round 1" else "round2_guard$;"))
                  first_dml = sql.find("WITH new_hospital AS")
                  if guard_end < 0 or first_dml < 0 or guard_end > first_dml:
                      errors.append(f"PostgreSQL incremental fixture {label} must complete its precondition guard before data-changing statements.")
                  if "CareSync" in sql:
                      errors.append(f"PostgreSQL incremental fixture {label} contains a stale CareSync identifier.")

              for required in (
                  "20 new events with IDs 8,229–8,248",
                  "complete 25-provider snapshot",
                  "complete 30-provider snapshot",
                  "The later file replaces the reference snapshot",
              ):
                  if required not in fixture_contract:
                      errors.append(f"Source fixture contract documentation is missing a verified fixture rule: {required}")

          # Static contract checks for the metadata-driven ADLS CSV file manifest.
          pipeline_path = Path("04_Azure Data Factory Repository/pipeline/PL_SOURCE_TO_SILVER_INNER.json")
          dataset_path = Path("04_Azure Data Factory Repository/dataset/DS_Csv_Binary_File.json")
          control_sql_path = Path("02_Metadata Table Queries/create_control_tables.sql")
          reset_sql_path = Path("02_Metadata Table Queries/drop_control_tables.sql")
          landing_notebook_path = Path("05_Databricks_Repository/Landing_to_Bronze.ipynb")
          try:
              pipeline = json.loads(pipeline_path.read_text(encoding="utf-8"))
              top_activities = pipeline["properties"]["activities"]
              by_name = {activity["name"]: activity for activity in top_activities}
              switch = by_name["Check Source System"]
              csv_case = next(case for case in switch["typeProperties"]["cases"] if case["value"] == "adls_csv")
              csv_activities = {activity["name"]: activity for activity in csv_case["activities"]}
              foreach = csv_activities["Ingest New CSV Files"]
              nested = {activity["name"]: activity for activity in foreach["typeProperties"]["activities"]}
              manifest_branch = nested["If File Needs Ingestion"]["typeProperties"]["ifTrueActivities"]
              manifest_branch_names = {activity["name"] for activity in manifest_branch}

              required_csv_activities = {
                  "List Source CSV Files", "Filter CSV Files",
                  "Validate FULL CSV inventory", "Ingest New CSV Files",
              }
              missing_csv_activities = required_csv_activities - set(csv_activities)
              if missing_csv_activities:
                  errors.append(f"CSV manifest orchestration activities missing: {sorted(missing_csv_activities)}")

              required_file_activities = {
                  "Read Current File Metadata", "Check File Manifest", "If File Needs Ingestion",
              }
              missing_file_activities = required_file_activities - set(nested)
              if missing_file_activities:
                  errors.append(f"Per-file manifest activities missing: {sorted(missing_file_activities)}")

              required_manifest_steps = {
                  "Record File In Progress", "Copy CSV File to Landing",
                  "Mark File Copied", "Mark File Copy Failed", "Fail CSV File Ingestion",
              }
              if not required_manifest_steps.issubset(manifest_branch_names):
                  errors.append("Per-file manifest state/copy/failure handling is incomplete.")

              file_metadata = nested.get("Read Current File Metadata", {}).get("typeProperties", {})
              if not {"size", "lastModified", "contentMD5"}.issubset(set(file_metadata.get("fieldList", []))):
                  errors.append("Per-file Get Metadata must request size, lastModified, and contentMD5.")

              processed = by_name.get("Mark File Manifest Processed", {})
              processed_dependencies = processed.get("dependsOn", [])
              if not any(
                  dep.get("activity") == "Bronze to Silver"
                  and "Succeeded" in dep.get("dependencyConditions", [])
                  for dep in processed_dependencies
              ):
                  errors.append("File manifest must transition to PROCESSED only after Bronze-to-Silver succeeds.")

              watermark_gate = by_name.get("Check load type", {}).get("typeProperties", {}).get("expression", {}).get("value", "")
              checkpoint_gate = by_name.get("Checking Load Type and Update Watermark", {}).get("typeProperties", {}).get("expression", {}).get("value", "")
              if "neon_postgres" not in watermark_gate or "neon_postgres" not in checkpoint_gate:
                  errors.append("Timestamp watermark lookup/update must be limited to PostgreSQL sources.")

              file_dataset = json.loads(dataset_path.read_text(encoding="utf-8"))
              file_location = file_dataset["properties"]["typeProperties"]["location"]
              if file_location.get("fileName", {}).get("value") != "@dataset().fileName":
                  errors.append("Parameterized single-file ADLS dataset must bind fileName from its dataset parameter.")

              control_sql = control_sql_path.read_text(encoding="utf-8")
              reset_sql = reset_sql_path.read_text(encoding="utf-8")
              if "CREATE TABLE ctrl.file_ingestion_manifest" not in control_sql:
                  errors.append("Control DDL is missing ctrl.file_ingestion_manifest.")
              if "UQ_file_ingestion_manifest_identity" not in control_sql:
                  errors.append("File manifest must enforce a unique file-version identity.")
              if "DROP TABLE ctrl.file_ingestion_manifest" not in reset_sql:
                  errors.append("Disposable reset script must drop the file manifest before parent control tables.")

              landing_notebook = json.loads(landing_notebook_path.read_text(encoding="utf-8"))
              landing_source = "\n".join(
                  "".join(cell.get("source", []))
                  for cell in landing_notebook.get("cells", [])
                  if cell.get("cell_type") == "code"
              )
              if 'source_system == "adls_csv"' not in landing_source or 'dbutils.notebook.exit("NO_DATA")' not in landing_source:
                  errors.append("Landing notebook must support the FULL CSV no-new-version no-op status.")
              if 'reason == "No landing data files found for this batch."' not in landing_source:
                  errors.append("Landing notebook must preserve FULL CSV no-new-version NO_DATA semantics after file filtering.")
              # Static Landing-to-Bronze batch, metadata, and schema contracts.
              required_landing_contracts = {
                  "blank load_type widget default": 'dbutils.widgets.text("load_type", "")',
                  "fail-closed load strategy validation": 'normalized_load_type not in {"FULL", "APPEND", "MERGE"}',
                  "no implicit FULL fallback": 'normalized_load_type = (load_type or "").strip().upper()',
                  "source system identifier validation": 're.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", source_system or "")',
